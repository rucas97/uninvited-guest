name: Build Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ""
      # Tell Ren'Py to use the virtual display we will create
      DISPLAY: ":99"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt-hotspot'
          java-version: '21'

      - name: Install xvfb (Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Start xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3

      - name: Create keystore
        run: base64 -d <<<"$ANDROID_KEYSTORE" > android.keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create .android.json configuration
        run: |
          cat > .android.json << 'JSONEOF'
          {
            "package": "com.rucas97.uninvitedguest",
            "name": "Uninvited Guest",
            "icon_name": "Uninvited Guest",
            "version": "1.0.0",
            "numeric_version": 1,
            "orientation": "landscape",
            "permissions": ["VIBRATE"],
            "store": "none",
            "update_keystores": false
          }
          JSONEOF

      - name: Install Ren'Py and Android SDK
        uses: Ayowel/renpy-setup-action@v2.0.1
        with:
          action: install
          version: 8.3.4
          dlc: rapt
          android_sdk: true
          android_properties: |
            key.alias=${{ secrets.KEY_ALIAS }}
            key.store.password=${{ secrets.KEYSTORE_PASSWORD }}
            key.alias.password=${{ secrets.KEY_PASSWORD }}
            key.store=${{ github.workspace }}/android.keystore

      - name: Build Android APK
        uses: Ayowel/renpy-setup-action@v2.0.1
        with:
          action: android_build
          build_type: apk
          out_dir: target

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uninvited-guest-apk
          path: target/*.apk
          if-no-files-found: warn
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/*.apk
          generate_release_notes: true
