name: Build Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Required because GitHub-hosted runners provide an incompatible NDK
      ANDROID_NDK_HOME: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt-hotspot'
          java-version: '21'

      - name: Create keystore
        run: base64 -d <<<"$ANDROID_KEYSTORE" > android.keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Install Ren'Py and Android SDK
        uses: Ayowel/renpy-setup-action@v2.0.1
        with:
          action: install
          version: 8.3.4
          dlc: rapt
          android_sdk: true
          android_properties: |
            key.alias=${{ secrets.KEY_ALIAS }}
            key.store.password=${{ secrets.KEYSTORE_PASSWORD }}
            key.alias.password=${{ secrets.KEY_PASSWORD }}
            key.store=${{ github.workspace }}/android.keystore

      - name: Build Android APK
        uses: Ayowel/renpy-setup-action@v2.0.1
        with:
          action: android_build
          build_type: apk
          game: project
          out_dir: target

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uninvited-guest-apk
          path: target/*.apk
          if-no-files-found: warn
